name: DroidBerth

options:
  bundleIdPrefix: dev.tango
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# 三个构建配置。**只有 Release-MAS 带沙盒** —— 侧载版继续用 Release，两者互不影响。
#
# 把类型（`debug` / `release`）显式写出来是有意的：XcodeGen 的「设置预设」按配置名
# 推断类型，名字不落在这两类上时会**拿不到任何预设**。写清楚才能保证 Release-MAS
# 拿到 release 那一套（`-O`、`SWIFT_COMPILATION_MODE=wholemodule` 等），
# 而不是掉进 Debug 的默认（`-Onone`）—— 后者会让 MAS 版白白慢一大截且不易察觉。
configs:
  Debug: debug
  Release: release
  Release-MAS: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEAD_CODE_STRIPPING: YES

schemes:
  DroidBerth:
    build:
      targets:
        DroidBerth: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  DroidBerth:
    type: application
    platform: macOS
    sources:
      - path: Sources/DroidBerth
      # App 图标。**入库**（2026-10-11 改）—— 它不是构建产物而是必需的源文件：
      # xcodegen 要求列在这里的路径**存在**，而新克隆的仓库原本**连 generate 都跑不过**
      # （实测报 `has a missing source directory`）。生成脚本是 scripts/make-icon.py，
      # 唯一来源仍是那份脚本 + docs/design/ 下的设计稿。
      # ⚠️ 若删掉本文件，`build.sh` 会先生成它（顺序：图标 → sidecar → generate → build），
      #    但**手工**跑 `xcodegen generate` 会直接失败。
      - path: Resources/icon.icns
        buildPhase: resources
      # 随包分发的第三方声明（PRD §28：`adb` 的 `NOTICE.txt` 必须跟包走）。
      # **不入库** —— 理由与下面 `Sidecar/` 相同（体积大 + 许可待法务确认，见 .gitignore），
      # 由 `build.sh` 在 `xcodegen generate` 之前从 `vendor/platform-tools/NOTICE.txt`
      # 暂存到这里。⚠️ 与 icon.icns 一样，**手工**跑 `xcodegen generate` 时若它不在，
      #    xcodegen 会直接报 `has a missing source directory`。
      - path: Resources/NOTICE.txt
        buildPhase: resources
      # entitlements 列进工程只为**可见、可 review**（`buildPhase: none` ⇒ 不进任何构建阶段）。
      # 真正生效的是 `CODE_SIGN_ENTITLEMENTS` 那个 build setting，见下方 settings.configs。
      - path: Resources/DroidBerth.entitlements
        buildPhase: none
      - path: Resources/DroidBerth-MAS.entitlements
        buildPhase: none
      - path: Resources/Helper-MAS.entitlements
        buildPhase: none
      - path: Sidecar/droidberth-adb
        buildPhase:
          copyFiles:
            destination: executables
        attributes:
          - CodeSignOnCopy
      - path: Sidecar/adb
        buildPhase:
          copyFiles:
            destination: executables
        attributes:
          - CodeSignOnCopy
    settings:
      base:
        PRODUCT_NAME: DroidBerth
        PRODUCT_BUNDLE_IDENTIFIER: dev.tango.droidberth
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/DroidBerth.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: UKXWZ3FS84
        ENABLE_HARDENED_RUNTIME: YES
        # 注意：CODE_SIGN_INJECT_BASE_ENTITLEMENTS 刻意**不在这里**声明 ——
        # 它必须按配置区分（见下方 configs），写进 base 会造成两处事实。
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
      configs:
        # Release 关掉基础 entitlements 注入：带 com.apple.security.get-task-allow 的包
        # **无法公证**，会直接把 PRD §28 的公证链断掉。
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # Debug 则必须开着 —— 这条是 Xcode 对 Debug 构建的默认行为，注入的
        # get-task-allow 是调试器 attach 的许可票。base 里一刀切关掉，代价就是
        # Xcode 里点 Run 会报「Not allowed to attach to process」（2026-10-10 实测）。
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
        # MAS 版（方案 docs/1011_04_appstore-plan.md §4 的 E3）：换 entitlements、换签名身份。
        #
        # `PROVISIONING_PROFILE_SPECIFIER` **有意不在这里声明**，理由有两条：
        #   ① 它是**部署期数据**（那串 profile 名字是 Apple 分配给你的），不是工程配置，
        #      与 MARKETING_VERSION 同类 ⇒ 从命令行注入，而不是把本机的值写进仓库；
        #   ② 本文件里若留一个空值占位，只会让 xcodebuild 的报错更难读。
        # 注入方式（`xcodebuild` 不认环境变量为 build setting，必须走 build.sh 的口子）：
        #
        #   CONFIGURATION=Release-MAS \
        #   XCODEBUILD_ARGS='PROVISIONING_PROFILE_SPECIFIER=DroidBerth MAS' ./scripts/build.sh
        #
        # ⚠️ 现在还**构建不了** —— 缺 Apple Distribution 对应的 provisioning profile，
        #    也还没申请 `Mac Installer Distribution` 证书。属**预期**，不是坏了。
        #    想在没有 profile 的情况下试这个配置：把签名换掉即可（entitlements 照旧生效）——
        #
        #   CONFIGURATION=Release-MAS \
        #   XCODEBUILD_ARGS='CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual' ./scripts/build.sh
        #
        #    这样出来的包是 ad-hoc 签名、**本机可运行**，正好用来观察沙盒下的真实行为；
        #    但它当然不能上架（签名不对），也不该拿去分发。
        Release-MAS:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: Resources/DroidBerth-MAS.entitlements
          CODE_SIGN_IDENTITY: "Apple Distribution"
    preBuildScripts:
      - name: Verify staged sidecar
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          for f in droidberth-adb adb; do
            p="$SRCROOT/Sidecar/$f"
            if [ ! -x "$p" ]; then
              echo "error: $p 不存在或不可执行" >&2
              echo "error: 先运行 macos/Scripts/build-sidecar.sh" >&2
              exit 1
            fi
          done
          # third-party 声明也要在（PRD §28 要求随包分发）。它由 build.sh 从 vendor/ 暂存，
          # 而 vendor/ 刻意不入库 —— 所以新克隆的机器上很容易缺这一份。
          if [ ! -f "$SRCROOT/Resources/NOTICE.txt" ]; then
            echo "error: $SRCROOT/Resources/NOTICE.txt 不存在" >&2
            echo "error: 先运行 ./scripts/fetch-adb.sh（取回 platform-tools，含 NOTICE.txt）" >&2
            echo "error: 或者直接跑 ./scripts/build.sh —— 它会自己暂存" >&2
            exit 1
          fi
          "$SRCROOT/Sidecar/droidberth-adb" version
