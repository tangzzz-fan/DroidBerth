name: DroidBerth

options:
  bundleIdPrefix: dev.tango
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEAD_CODE_STRIPPING: YES

schemes:
  DroidBerth:
    build:
      targets:
        DroidBerth: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  DroidBerth:
    type: application
    platform: macOS
    sources:
      - path: Sources/DroidBerth
      - path: Sidecar/droidberth-adb
        buildPhase:
          copyFiles:
            destination: executables
        attributes:
          - CodeSignOnCopy
      - path: Sidecar/adb
        buildPhase:
          copyFiles:
            destination: executables
        attributes:
          - CodeSignOnCopy
    settings:
      base:
        PRODUCT_NAME: DroidBerth
        PRODUCT_BUNDLE_IDENTIFIER: dev.tango.droidberth
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/DroidBerth.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        DEVELOPMENT_TEAM: UKXWZ3FS84
        ENABLE_HARDENED_RUNTIME: YES
        # 注意：CODE_SIGN_INJECT_BASE_ENTITLEMENTS 刻意**不在这里**声明 ——
        # 它必须按配置区分（见下方 configs），写进 base 会造成两处事实。
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
      configs:
        # Release 关掉基础 entitlements 注入：带 com.apple.security.get-task-allow 的包
        # **无法公证**，会直接把 PRD §28 的公证链断掉。
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        # Debug 则必须开着 —— 这条是 Xcode 对 Debug 构建的默认行为，注入的
        # get-task-allow 是调试器 attach 的许可票。base 里一刀切关掉，代价就是
        # Xcode 里点 Run 会报「Not allowed to attach to process」（2026-10-10 实测）。
        Debug:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
    preBuildScripts:
      - name: Verify staged sidecar
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          for f in droidberth-adb adb; do
            p="$SRCROOT/Sidecar/$f"
            if [ ! -x "$p" ]; then
              echo "error: $p 不存在或不可执行" >&2
              echo "error: 先运行 macos/Scripts/build-sidecar.sh" >&2
              exit 1
            fi
          done
          "$SRCROOT/Sidecar/droidberth-adb" version
