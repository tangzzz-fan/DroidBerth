name: Release

# 发布链是**不可逆的对外动作**，所以只由 tag 触发，不跟每次提交跑。
#   · 推 `v*` tag        → 构建 + 签名 + 公证 + 打 DMG + 建 GitHub Release
#   · 手动 workflow_dispatch → 只构建与公证，产物作为 workflow artifact（干跑，不发 Release）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "用于干跑的版本号（形如 0.2.0）。留空则用 project.yml 里的 MARKETING_VERSION"
        required: false

permissions:
  contents: write # 建 Release 需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布不允许被取消

jobs:
  release:
    name: 签名 · 公证 · 分发
    # 同 ci.yml：**必须 arm64**（本项目只发 Apple Silicon，`ARCHS: arm64`）。
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # ── 前置：凭据齐不齐，缺哪个要说清 ──────────────────────────────
      #
      # 这一步存在的唯一理由是**把「缺 secret」变成一条能照做的提示**。
      # 没有它，缺凭据会在十分钟后以 codesign 或 notarytool 的原文报错出现，
      # 而那条报错不会告诉你该去仓库设置里加什么。
      - name: 检查发布凭据
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          missing=()
          # 用 printenv 而不是 `${!v:-}` —— runner 上的 bash 是 macOS 自带的 3.2，
          # 那一版对「间接展开 + 默认值」的组合支持不稳。
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "$(printenv "$v" || true)" ] || missing+=("$v")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::缺少 ${#missing[@]} 个 Repository secret：${missing[*]}"
            cat <<'EOF'
          ────────────────────────────────────────────────────────────────
          需要在 Settings → Secrets and variables → Actions 里加：

            BUILD_CERTIFICATE_BASE64      Developer ID Application 证书的 .p12，base64 后的单行
                                          （本机：base64 -i cert.p12 | pbcopy）
            P12_PASSWORD                 导出 .p12 时设的密码
            KEYCHAIN_PASSWORD            任意随机串，CI 上临时钥匙串的密码（自己编一个即可）
            APPLE_ID                     你的 Apple ID 邮箱
            APPLE_APP_SPECIFIC_PASSWORD  appleid.apple.com 生成的 app-specific password
            APPLE_TEAM_ID                10 位 Team ID（本项目是 UKXWZ3FS84）

          说明：这里的 APPLE_PASSWORD 环境变量名对应 secret
          APPLE_APP_SPECIFIC_PASSWORD —— 因为 scripts/notarize.sh 读的是
          APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 这三个（env.sh 也认钥匙串 profile，
          但 CI 上更简单的是直接给这三个）。
          ────────────────────────────────────────────────────────────────
          EOF
            exit 1
          fi
          echo "发布凭据齐备（6 个）。"

      - name: 工具链
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun swift --version
          brew install xcodegen
          command -v rustup >/dev/null 2>&1 || {
            echo "::error::runner 上没有 rustup。改用 dtolnay/rust-toolchain@stable，或换镜像。"
            exit 1
          }
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version

      # vendor/ 不在仓库里（刻意，见 .gitignore），每次构建都要自己取。
      - name: 取 adb
        run: ./scripts/fetch-adb.sh

      # ── 把 Developer ID 证书装进临时钥匙串 ──────────────────────────
      #
      # scripts/env.sh 的 detect_identity() 会自动在钥匙串里找
      # `Developer ID Application: …`，project.yml 里的 CODE_SIGN_IDENTITY 也是这个字符串，
      # 所以**不需要**再传身份名 —— 证书一进来，构建与公证都会自动认它。
      - name: 导入签名证书
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          # 没有这一步，codesign 会弹「允许访问钥匙串」的交互框 —— CI 上没人能点，
          # 于是表现为 codesign 挂住直到超时。这是这类流水线最常见的坑之一。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "── 钥匙串里的签名身份 ──"
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning | grep -q "Developer ID Application" || {
            echo "::error::钥匙串里没有 Developer ID Application 身份 —— 检查 BUILD_CERTIFICATE_BASE64 是不是 Developer ID（不是 Apple Development）"
            exit 1
          }

      - name: 解析版本号
        # tag 是 v0.2.0 这种形状；Info.plist 用的是 $(MARKETING_VERSION)，
        # 所以把纯版本号透传给 xcodebuild 即可。手动干跑时用 inputs.version，
        # 两者都空就回落到 project.yml 里的值。
        run: |
          set -euo pipefail
          RAW="${{ github.event_name == 'push' && github.ref_name || inputs.version }}"
          VERSION="${RAW#v}"
          [ -n "$VERSION" ] || VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' macos/project.yml)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建版本：$VERSION"

      - name: 构建
        # 签名身份不用指定：证书已导入钥匙串，scripts/env.sh 的 detect_identity() 会自己找到
        # Developer ID Application，project.yml 里的 CODE_SIGN_IDENTITY 也是这个字符串。
        #
        # ⚠️ 版本号必须走 `XCODEBUILD_ARGS`（命令行 build setting），**不能**用环境变量 ——
        # 实测 `MARKETING_VERSION=9.9.9 xcodebuild …` 产出的 Info.plist 仍是 0.1.0。
        run: |
          set -euo pipefail
          XCODEBUILD_ARGS="MARKETING_VERSION=${APP_VERSION} CURRENT_PROJECT_VERSION=${{ github.run_number }}" \
            ./scripts/build.sh

      - name: 回归守卫
        run: ./scripts/check-all.sh

      # ── 公证 ────────────────────────────────────────────────────────
      #
      # 凭据**只在这一步出现**：scripts/build.sh 会主动 unset 掉 APPLE_*（信任链要求
      # 构建工具看不见公证凭据，PRD §28），所以这一步的 env 不会被构建继承。
      - name: 公证（app + DMG）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/notarize.sh

      # ── 验证：不接受「notarytool 说 Accepted」就完事 ────────────────
      - name: 验证票据与 Gatekeeper
        run: |
          set -euo pipefail
          APP="macos/build/dd/Build/Products/Release/DroidBerth.app"
          DMG="macos/build/dmg/DroidBerth.dmg"

          echo "── stapler validate ──"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

          echo
          echo "── codesign --verify --deep --strict ──"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo
          echo "── 嵌套二进制的身份与 hardened runtime ──"
          for bin in "$APP/Contents/MacOS"/*; do
            [ -f "$bin" ] || continue
            printf '%s  ' "$(basename "$bin")"
            codesign -dv "$bin" 2>&1 | sed -n 's/.*flags=\(0x[0-9a-f]*\).*/\1/p' | tr -d '\n'
            printf '  '
            codesign -dv "$bin" 2>&1 | sed -n 's/^TeamIdentifier=//p'
          done

          echo
          echo "── spctl ──"
          SPCTL="$(spctl -a -vvv "$APP" 2>&1 || true)"
          echo "$SPCTL"
          case "$SPCTL" in
            *rejected*) echo "::error::Gatekeeper 拒绝了产物"; exit 1 ;;
            *Notarized*) echo "Gatekeeper 认可：Notarized Developer ID" ;;
            *) echo "::warning::spctl 的措辞不是预期的 'Notarized'，请人工看上面的输出" ;;
          esac

      # ── 收产物 ──────────────────────────────────────────────────────
      - name: 整理分发产物
        run: |
          set -euo pipefail
          mkdir -p dist
          cp macos/build/dmg/DroidBerth.dmg "dist/DroidBerth-${APP_VERSION}.dmg"
          # 顺带把 app 也压一份 —— 有人习惯直接拖 app，不给的话他们只能挂 DMG。
          #
          # 用 `zip -X -y` 而**不是** Apple 文档推荐的 `ditto -c -k`：本机实测，只要源文件带
          # `com.apple.provenance` 这类扩展属性，ditto 就会给每个成员写一个**同目录的
          # `._<名字>` AppleDouble 边车**（现成的 app 里 13 个，连 `._CodeResources` 都有），
          # 在 Windows / Linux 上解压就是一堆垃圾文件；`--norsrc --noextattr` 拦不住（实测），
          # 先 `xattr -cr` 也拦不住（ditto 自己会再打上 provenance）。`zip -X` 得到 0 个。
          # `-y` 是让软链仍以软链存储（`-X` 去掉的只是扩展属性与额外字段）。
          #
          # 安全性已实测：app 的签名在 `Contents/_CodeSignature/CodeResources` 这个**普通文件**里，
          # 不依赖扩展属性 —— 解压后 `codesign --verify --deep --strict`、`stapler validate`、
          # `spctl -a -vvv` 三项均通过（`source=Notarized Developer ID`）。
          APP_ZIP="$PWD/dist/DroidBerth-${APP_VERSION}.zip"
          ( cd macos/build/dd/Build/Products/Release \
            && /usr/bin/zip -q -r -X -y "$APP_ZIP" DroidBerth.app )

          # adb（Android platform-tools）的 Apache-2.0 声明。它本来就在 app 包里
          # （`Contents/Resources/NOTICE.txt`，PRD §28 要求随包分发），这里再单独挂一份 ——
          # 让人不必先下 40 MB 的 DMG 才能看到许可。
          cp vendor/platform-tools/NOTICE.txt dist/

          # 仓库自身的许可 / 变更记录，有就一起挂。
          # ⚠️ 不能写成 `[ -f x ] && cp …`：在 `set -e` 下前者为假会让整步非零退出。
          # 也不要在这里再挂 NOTICE —— 上面那份就是 NOTICE.txt，会互相覆盖。
          for extra in LICENSE LICENSE.txt CHANGELOG.md; do
            if [ -f "$extra" ]; then
              cp "$extra" dist/
            fi
          done

          ls -lh dist
          # 校验和用**裸文件名**（在 dist 里生成），这样用户下载后直接
          # `shasum -a 256 -c SHA256SUMS.txt` 就能验，不必假设目录结构。
          # 逐个 `[ -f ]` 而不是通配展开：未命中的通配符会原样传给 shasum 并报错。
          (
            cd dist
            files=()
            for f in ./*.dmg ./*.zip ./NOTICE.txt ./LICENSE ./LICENSE.txt ./CHANGELOG.md; do
              if [ -f "$f" ]; then
                files+=("$f")
              fi
            done
            shasum -a 256 "${files[@]}" > SHA256SUMS.txt
          )
          cat dist/SHA256SUMS.txt

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DroidBerth-${{ env.APP_VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: 建 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 说明文字用**引号 heredoc**（不展开），否则 markdown 里的反引号会被当成命令替换。
          # 版本号用占位符代进去。
          cat > "$RUNNER_TEMP/notes.tpl" <<'TPL'
          ## 下载

          | 文件 | 说明 |
          | --- | --- |
          | **`DroidBerth-__VERSION__.dmg`** | **推荐**。已签名 + 已公证 + 已 staple。打开后把 DroidBerth 拖进左边的「应用程序」即可 |
          | `DroidBerth-__VERSION__.zip` | 同一份 app 的压缩包；习惯直接拖 app 的人用这个 |
          | `NOTICE.txt` | `adb`（Android platform-tools）的 Apache-2.0 声明。它也在 app 包内（`Contents/Resources/NOTICE.txt`） |
          | `SHA256SUMS.txt` | 上面各文件的 SHA-256 |
          | Source code (zip / tar.gz) | GitHub 自动附带的源码快照 |

          **需要 Apple Silicon（M 系列）**，macOS 14 或更高。本项目不发 Intel 版本。

          ## 安装

          1. 打开 `DroidBerth-__VERSION__.dmg`
          2. 把 **DroidBerth** 拖到左边的 **Applications**
          3. 直接打开即可 —— 包已公证，不需要「右键 → 打开」绕过 Gatekeeper

          ## 校验（可选）

          ```bash
          shasum -a 256 -c SHA256SUMS.txt
          ```

          ## 内容
          TPL
          sed "s/__VERSION__/${APP_VERSION}/g" "$RUNNER_TEMP/notes.tpl" > "$RUNNER_TEMP/notes.md"

          # GitHub 会把 `--notes-file` 的内容**前置**到自动生成的变更清单之上
          # （REST API 的 body + generate_release_notes 语义），所以两者可以并用。
          gh release create "${GITHUB_REF_NAME}" \
            --title "DroidBerth ${GITHUB_REF_NAME}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag \
            dist/*
